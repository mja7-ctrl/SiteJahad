      // --- ۴. فرم ثبت‌نام و ورود ---
      function AuthSection({ onAuthSuccess }) {
        const [activeTab, setActiveTab] = useState('register');
        const [formData, setFormData] = useState({
          fullName: '',
          studentId: '',
          university: '',
          major: '',
          degree: 'کارشناسی',
          age: '',
          phone: ''
        });
        const [loginUser, setLoginUser] = useState('');
        const [loginPass, setLoginPass] = useState('');
        const [errors, setErrors] = useState({});

        const validateRegister = () => {
          const errs = {};
          const phoneEn = toEnDigits(formData.phone).trim();
          const studentIdEn = toEnDigits(formData.studentId).trim();
          const ageEn = toEnDigits(formData.age).trim();

          if (!formData.fullName.trim()) errs.fullName = 'نام و نام خانوادگی الزامی است';
          if (!studentIdEn) errs.studentId = 'شماره دانشجویی الزامی است';
          if (!formData.university.trim()) errs.university = 'نام دانشگاه الزامی است';
          if (!formData.major.trim()) errs.major = 'رشته تحصیلی الزامی است';
          if (!ageEn || isNaN(Number(ageEn)) || Number(ageEn) < 16 || Number(ageEn) > 55) {
            errs.age = 'سن معتبر وارد کنید';
          }
          if (!/^09\d{9}$/.test(phoneEn)) {
            errs.phone = 'شماره همراه باید ۱۱ رقم و با ۰۹ شروع شود';
          }
          return errs;
        };

        const handleRegister = (e) => {
          e.preventDefault();
          const errs = validateRegister();
          setErrors(errs);
          if (Object.keys(errs).length > 0) return;
          const cleanPhone = toEnDigits(formData.phone).trim();
          const newUser = { ...formData, phone: cleanPhone, studentId: toEnDigits(formData.studentId).trim() };
          localStorage.setItem('mowj_user', JSON.stringify(newUser));
          onAuthSuccess(newUser);
        };

        const handleLogin = (e) => {
          e.preventDefault();
          const userPhone = toEnDigits(loginUser).trim();
          const passPhone = toEnDigits(loginPass).trim();

          if (!/^09\d{9}$/.test(userPhone)) {
            setErrors({ loginUser: 'نام کاربری همان شماره همراه ۱۱ رقمی شماست.' });
            return;
          }
          if (!/^09\d{9}$/.test(passPhone)) {
            setErrors({ loginPass: 'رمز عبور همان شماره همراه ۱۱ رقمی شماست.' });
            return;
          }

          const saved = localStorage.getItem('mowj_user');
          if (saved) {
            onAuthSuccess(JSON.parse(saved));
          } else {
            const demo = {
              fullName: 'دانشجوی رویداد',
              studentId: '۴۰۱۲۳۴۵۶',
              university: 'دانشگاه سراسری',
              major: 'هنر و فناوری',
              degree: 'کارشناسی',
              age: '۲۱',
              phone: userPhone
            };
            localStorage.setItem('mowj_user', JSON.stringify(demo));
            onAuthSuccess(demo);
          }
        };

              <div className="text-center mb-8">

                <h2 className="text-2xl sm:text-4xl font-black text-zero-ink">
                  ثبت‌نام و ورود به پنل کاربری
                </h2>
                <p className="text-sm text-neutral-700 mt-2 font-medium">
                  پس از ثبت‌نام، مستقیم وارد پروفایل خودت می‌شوی تا ویدیوها و بانک داستان را ببینی و اثرت را بارگذاری کنی.

              </div>

              <div className="zero-card p-6 sm:p-10">
                <div className="grid grid-cols-2 gap-2 p-1.5 rounded-xl bg-zero-surface border-2 border-zero-ink mb-8">
                  <button
                    type="button"
                    onClick={() => { setActiveTab('register'); setErrors({}); }}
                    className={`py-3 rounded-lg text-sm font-black transition-all ${
                      activeTab === 'register'
                        ? 'bg-zero-ink text-zero-lime shadow-sm'
                        : 'text-zero-ink hover:bg-white/60'
                    }`}
                  >
                    ثبت‌نام در رویداد
                  </button>
                  <button
                    type="button"
                    onClick={() => { setActiveTab('login'); setErrors({}); }}
                    className={`py-3 rounded-lg text-sm font-black transition-all ${
                      activeTab === 'login'
                        ? 'bg-zero-ink text-zero-lime shadow-sm'

                      />
                      {errors.fullName && <p className="text-xs text-zero-coral font-bold mt-1">{errors.fullName}</p>}

                    <div className="grid sm:grid-cols-2 gap-4">

                        />

                      </div>
                      <div>
                        <label className="block text-xs font-black text-zero-ink mb-1.5">مقطع تحصیلی</label>
                        <select
                          value={formData.degree}
                          onChange={(e) => setFormData({ ...formData, degree: e.target.value })}
                          className="input-zero"
                        >
                          <option value="کاردانی">کاردانی</option>
                          <option value="کارشناسی">کارشناسی</option>
                          <option value="کارشناسی ارشد">کارشناسی ارشد</option>
                          <option value="دکتری">دکتری</option>

                      </div>
                    </div>

                    <div className="grid sm:grid-cols-2 gap-4">
                      <div>
                        <label className="block text-xs font-black text-zero-ink mb-1.5">سن</label>
                        <input

                        />
                        {errors.age && <p className="text-xs text-zero-coral font-bold mt-1">{errors.age}</p>}
                      </div>
                      <div>
                        <label className="block text-xs font-black text-zero-ink mb-1.5">شماره تماس (تلفن همراه)</label>

                          placeholder="09123456789"
                        />
                        {errors.phone && <p className="text-xs text-zero-coral font-bold mt-1">{errors.phone}</p>}
                      </div>
                    </div>

                    <div className="mt-3 p-3.5 rounded-xl bg-zero-surface border-2 border-zero-ink text-xs text-zero-ink leading-relaxed font-medium">
                      <strong>توجه:</strong> شماره همراه شما، هم به عنوان <strong>نام کاربری</strong> و هم <strong>رمز عبور</strong> برای ورودهای بعدی به پنل خواهد بود.
                    </div>

                    <button type="submit" className="w-full btn-zero-primary py-4 text-sm sm:text-base mt-2">
                      ثبت‌نام و ورود مستقیم به پنل کاربری
                    </button>
                  </form>
                ) : (
                  <form onSubmit={handleLogin} className="space-y-4">

                      <label className="block text-xs font-black text-zero-ink mb-1.5">

                      <input

                        value={loginPass}
                        onChange={(e) => setLoginPass(e.target.value)}
                        className="input-zero text-center tracking-widest text-base"

                      />
                      {errors.loginPass && <p className="text-xs text-zero-coral font-bold mt-1">{errors.loginPass}</p>}

                  <h3 className="text-xl font-black text-white mb-2">یک منتور همراه توست</h3>
                  <p className="text-xs text-neutral-300 leading-relaxed font-medium">
                    در هر مرحله از کار با ابزارهای هوش مصنوعی یا سناریونویسی سوالی داشتی، منتور رویداد آماده راهنمایی توست.
                  </p>
                </div>
                <button
                  onClick={() => alert('در نسخه نهایی، این دکمه به سامانه چت یا کانال پشتیبانی منتور متصل می‌شود.')}
                  className="mt-6 w-full py-3 rounded-xl bg-zero-lime text-zero-ink border-2 border-zero-ink font-black text-xs hover:bg-white transition-colors"
                >
                  ارتباط با منتور رویداد
                </button>
              </div>
            </div>

            {/* بخش ویدیوهای آموزشی تفکیک‌شده (۱۹ جلسه در ۴ سرفصل) */}
            <div className="zero-card p-6 sm:p-8">
              <div className="flex flex-col sm:flex-row sm:items-center justify-between gap-4 mb-6 pb-4 border-b-2 border-neutral-100">
                <div>
                  <h2 className="text-xl sm:text-2xl font-black text-zero-ink">
                    دوره‌های آموزشی گام‌به‌گام
                  </h2>
                  <p className="text-xs sm:text-sm text-neutral-600 font-medium mt-1">
                    ۱۹ جلسه آموزش تخصصی تولید محتوا، سناریو، تصویرسازی و متحرک‌سازی با هوش مصنوعی.
                  </p>
                </div>
                <span className="text-xs font-bold px-3 py-1.5 rounded-lg bg-zero-surface border border-zero-ink self-start sm:self-auto">
                  {toFa(watchedIds.length)} از {toFa(allLessons.length)} جلسه مشاهده شده
                </span>
              </div>

              <div className="grid lg:grid-cols-12 gap-6">
                
                {/* پلیر ویدیو */}
                <div className="lg:col-span-7 flex flex-col">
                  <div className="w-full aspect-video rounded-xl bg-zero-ink border-2 border-zero-ink flex flex-col items-center justify-center p-6 text-white text-center shadow-[4px_4px_0px_#111111]">
                    <button
                      onClick={() => alert(`پخش ویدیو: ${activeLesson.title}`)}
                      className="w-16 h-16 rounded-2xl bg-zero-lime text-zero-ink border-2 border-zero-ink font-black text-xl flex items-center justify-center shadow-[3px_3px_0px_#FFFFFF] hover:scale-105 transition-transform"
                    >
                      ▶
                    </button>
                    <span className="mt-4 text-sm font-bold max-w-sm">{activeLesson.title}</span>
                    <span className="text-xs text-neutral-400 mt-1">مدت زمان: {activeLesson.duration}</span>
                  </div>

                  <div className="mt-3 flex items-center justify-between p-3.5 rounded-xl bg-zero-surface border border-zero-ink">
                    <span className="text-xs font-bold text-neutral-700">{activeLesson.sectionTitle}</span>
                    <button
                      onClick={() => toggleWatch(activeLesson.id)}
                      className={`px-3 py-1.5 rounded-lg border border-zero-ink text-xs font-bold transition-colors ${
                        watchedIds.includes(activeLesson.id) ? 'bg-zero-lime text-zero-ink' : 'bg-white hover:bg-zero-lime'
                      }`}
                    >
                      {watchedIds.includes(activeLesson.id) ? '✓ مشاهده شد' : 'علامت‌گذاری به عنوان دیده‌شده'}
                    </button>
                  </div>
                </div>

                {/* فهرست ۴ سرفصل و جلسات */}
                <div className="lg:col-span-5 space-y-3 max-h-[460px] overflow-y-auto pl-1">
                  {courseSections.map((sec) => {
                    const isSecOpen = openSectionId === sec.id;
                    return (
                      <div key={sec.id} className="rounded-xl border-2 border-zero-ink overflow-hidden bg-white">
                        <button
                          onClick={() => setOpenSectionId(isSecOpen ? null : sec.id)}
                          className="w-full p-3 text-right flex items-center justify-between bg-zero-surface/60 font-black text-xs text-zero-ink border-b border-zero-ink/10"
                        >
                          <div>
                            <span className="block">{sec.title}</span>
                            <span className="text-[10px] text-neutral-500 font-semibold">{toFa(sec.lessons.length)} جلسه</span>
                          </div>
                          <div className={`transition-transform ${isSecOpen ? 'rotate-180' : ''}`}>
                            <ChevronDown className="w-4 h-4" />
                          </div>
                        </button>

                        {isSecOpen && (
                          <div className="p-2 space-y-1.5 bg-white">
                            {sec.lessons.map((les) => {
                              const isActive = activeLesson.id === les.id;
                              const isWatched = watchedIds.includes(les.id);
                              return (
                                <button
                                  key={les.id}
                                  onClick={() => setActiveLesson({ ...les, sectionTitle: sec.title })}
                                  className={`w-full text-right p-2.5 rounded-lg border transition-all flex items-center justify-between text-xs ${
                                    isActive
                                      ? 'bg-zero-lime border-zero-ink font-black shadow-[1px_1px_0px_#111111]'
                                      : 'bg-zero-bg/60 border-neutral-200 hover:border-zero-ink font-medium'
                                  }`}
                                >
                                  <div className="flex items-center gap-2">
                                    <span className={`w-4 h-4 rounded-full flex items-center justify-center text-[9px] font-black ${
                                      isWatched ? 'bg-zero-ink text-zero-lime' : 'bg-neutral-200 text-neutral-700'
                                    }`}>
                                      {isWatched ? '✓' : toFa(les.id)}
                                    </span>
                                    <span>{les.title}</span>
                                  </div>
                                  <span className="text-[10px] text-neutral-500 mr-2">{les.duration}</span>
                                </button>
                              );
                            })}
                          </div>
                        )}
                      </div>
                    );
                  })}
                </div>

              </div>
            </div>

            {/* بانک داستان */}
            <div className="zero-card p-6 sm:p-8 bg-zero-surface border-2 border-zero-ink">
              <div className="grid lg:grid-cols-12 gap-8 items-center">
                <div className="lg:col-span-5 space-y-4">
                  <span className="inline-block px-3 py-1 rounded-md bg-zero-ink text-zero-lime text-xs font-black">
                    ایده و سناریو
                  </span>
                  <h2 className="text-2xl font-black text-zero-ink">
                    بانک داستان‌های آماده
                  </h2>
                  <p className="text-sm text-neutral-700 leading-relaxed font-medium">
                    اگر ایده داستان در ذهن نداری، با کلیک روی دکمه زیر یکی از داستان‌های کوتاه و امیدبخش ما را دریافت و همان را تبدیل به انیمیشن کن.
                  </p>
                  <button onClick={pickStory} className="btn-zero-primary text-sm">
                    {currentStory ? 'یک داستان دیگر به من بده' : 'دریافت یک داستان از بانک داستان'}
                  </button>
                </div>

                <div className="lg:col-span-7">
                  {currentStory ? (
                    <div className="bg-white rounded-2xl p-6 border-2 border-zero-ink shadow-[4px_4px_0px_#111111]">
                      <div className="flex items-center justify-between pb-3 mb-3 border-b-2 border-neutral-100">
                        <div>
                          <span className="text-xs font-black text-zero-coral">{currentStory.theme}</span>
                          <h3 className="text-base sm:text-lg font-black text-zero-ink mt-1">{currentStory.title}</h3>
                        </div>
                        <button
                          onClick={copyStory}
                          className="px-3 py-1.5 rounded-lg border border-zero-ink text-xs font-bold bg-zero-surface hover:bg-zero-lime"
                        >
                          {copied ? 'کپی شد' : 'کپی متن'}
                        </button>
                      </div>
                      <p className="text-xs text-neutral-600 mb-2 font-medium">
                        <strong>کاراکترها:</strong> {currentStory.characters}
                      </p>
                      <p className="text-sm text-neutral-800 leading-relaxed mb-4">
                        {currentStory.story}
                      </p>
                      <div className="text-xs font-bold text-neutral-600 pt-2 border-t border-neutral-100">
                        پیام داستان: {currentStory.moral}
                      </div>
                    </div>
                  ) : (
                    <div className="p-8 rounded-2xl border-2 border-dashed border-zero-ink text-center text-sm font-bold text-neutral-600">
                      روی دکمه کلیک کن تا یکی از داستان‌های آماده رویداد برایت نمایش داده شود.
                    </div>
                  )}
                </div>
              </div>
            </div>

            {/* ارسال اثر نهایی */}
            <div className="zero-card p-6 sm:p-8">
              <div className="max-w-2xl mx-auto">
                <div className="text-center mb-6">
                  <h2 className="text-2xl font-black text-zero-ink">بارگذاری اثر نهایی</h2>
                  <p className="text-xs sm:text-sm text-neutral-600 font-medium mt-1">
                    انیمیشن تولیدشده باید حداقل ۱ دقیقه و با فرمت MP4 باشد.
                  </p>
                </div>

                {uploadSuccess ? (
                  <div className="p-6 rounded-2xl bg-zero-lime border-2 border-zero-ink text-center space-y-3">
                    <h3 className="text-lg font-black text-zero-ink">
                      اثر «{workTitle}» با موفقیت برای داوری ثبت شد
                    </h3>
                    <p className="text-xs text-neutral-800 font-medium">
                      فایل شما در دبیرخانه جشنواره ذخیره گردید و به زودی وارد فرآیند داوری می‌شود.
                    </p>
                    <button
                      onClick={() => { setUploadSuccess(false); setWorkTitle(''); setSelectedFile(null); }}
                      className="px-4 py-2 rounded-xl bg-white border border-zero-ink text-xs font-bold"
                    >
                      ارسال فایل جدید
                    </button>
                  </div>
                ) : (
                  <form onSubmit={(e) => { e.preventDefault(); if (workTitle && selectedFile) setUploadSuccess(true); }} className="space-y-4">
                    <div>
                      <label className="block text-xs font-black text-zero-ink mb-1.5">عنوان اثر انیمیشن</label>
                      <input
                        type="text"
                        required
                        value={workTitle}
                        onChange={(e) => setWorkTitle(e.target.value)}
                        className="input-zero"
                        placeholder="مثال: دانه کوچولوی امیدوار"
                      />
                    </div>

                    <div>
                      <label className="block text-xs font-black text-zero-ink mb-1.5">انتخاب فایل ویدیویی (MP4)</label>
                      <label className="flex flex-col items-center justify-center p-6 rounded-xl border-2 border-dashed border-zero-ink bg-zero-bg cursor-pointer hover:bg-zero-surface transition-colors">
                        <span className="text-xs font-bold text-neutral-800">
                          {selectedFile ? `فایل انتخاب‌شده: ${selectedFile.name}` : 'برای انتخاب فایل ویدیویی کلیک کنید'}
                        </span>
                        <input
                          type="file"
                          accept="video/mp4,video/*"
                          className="hidden"
                          onChange={(e) => setSelectedFile(e.target.files[0] || null)}
                        />
                      </label>
                    </div>

                    <button
                      type="submit"
                      disabled={!workTitle || !selectedFile}
                      className="w-full btn-zero-primary py-3.5 text-sm disabled:opacity-50"
                    >
                      ارسال نهایی اثر برای داوری جشنواره
                    </button>
                  </form>
                )}
              </div>
            </div>

          </div>
        );
      }

      // --- ۷. فوتر ---
      function Footer() {
        return (
          <footer className="bg-zero-ink text-white py-10 px-4 sm:px-6 border-t-2 border-zero-ink">
            <div className="max-w-6xl mx-auto flex flex-col sm:flex-row items-center justify-between gap-4 text-xs">
              <div className="flex items-center gap-3">
                {/* کادر سبز پایین فقط با لوگو به تنهایی (بدون متن موج امید) */}
                <div className="w-9 h-9 rounded-xl bg-zero-lime border border-zero-ink flex items-center justify-center shadow-[2px_2px_0px_#FFFFFF]">
                  <WaveLogo className="w-5 h-5 text-zero-ink" />
                </div>
                <span className="text-neutral-300 font-medium">دبیرخانه رویداد ملی انیمیشن‌سازی دانشجویی | جهاد دانشگاهی</span>
              </div>
              <div className="text-neutral-400">
                تمامی حقوق این سامانه محفوظ است.
              </div>
            </div>
          </footer>
        );
      }

      function App() {
        const [user, setUser] = useState(null);
        const [currentView, setCurrentView] = useState('landing');

        useEffect(() => {
          const loadUser = () => {
            const saved = localStorage.getItem('mowj_user');
            if (saved) {
              try { setUser(JSON.parse(saved)); } catch (e) {}
            }
          };
          loadUser();
          window.addEventListener('storage-update', loadUser);
          return () => window.removeEventListener('storage-update', loadUser);
        }, []);

        const handleAuthSuccess = (loggedInUser) => {
          setUser(loggedInUser);
          setCurrentView('panel');
          window.scrollTo({ top: 0, behavior: 'smooth' });
        };

        const handleLogout = () => {
          localStorage.removeItem('mowj_user');
          setUser(null);
          setCurrentView('landing');
        };

        return (
          <div className="min-h-screen flex flex-col justify-between">
            <Header
              user={user}
              currentView={currentView}
              setCurrentView={setCurrentView}
              onLogout={handleLogout}
            />

            <main className="flex-1">
              {currentView === 'panel' && user ? (
                <UserDashboard user={user} />
              ) : (
                <>
                  <HeroSection />
                  <EventProcess />
                  <AuthSection onAuthSuccess={handleAuthSuccess} />
                  <FAQSection />
                </>
              )}
            </main>

            <Footer />
          </div>
        );
      }

      const root = ReactDOM.createRoot(document.getElementById('root'));
      root.render(<App />);
    </script>
  </body>
</html>
