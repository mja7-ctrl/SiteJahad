      function AdminApp() {
        const [activeTab, setActiveTab] = useState('reports');
        const [sections, setSections] = useState([]);
        const [stories, setStories] = useState([]);
        const [users, setUsers] = useState([]);
        const [submissions, setSubmissions] = useState([]);

        // استیت‌های فرم افزودن بخش و ویدیو
        const [newSecTitle, setNewSecTitle] = useState('');
        const [newSecBadge, setNewSecBadge] = useState('');

        const [selectedSecId, setSelectedSecId] = useState('');
        const [newLessonTitle, setNewLessonTitle] = useState('');
        const [newLessonDuration, setNewLessonDuration] = useState('۱۵ دقیقه');
        const [newLessonUrl, setNewLessonUrl] = useState('');
        const [newLessonStatus, setNewLessonStatus] = useState('published');

        // استیت‌های فرم بانک داستان
        const [storyTitle, setStoryTitle] = useState('');
        const [storyTheme, setStoryTheme] = useState('');
        const [storyChars, setStoryChars] = useState('');
        const [storyBody, setStoryBody] = useState('');
        const [storyMoral, setStoryMoral] = useState('');

        // فیلتر گزارش کاربران
        const [searchQuery, setSearchQuery] = useState('');
        const [userFilter, setUserFilter] = useState('all');
        const [selectedStudentHistory, setSelectedStudentHistory] = useState(null);

        // بارگذاری اولیه از localStorage
        useEffect(() => {
          const savedSections = localStorage.getItem('mowj_sections');
          if (savedSections) {
            const parsed = JSON.parse(savedSections);
            setSections(parsed);
            if (parsed.length > 0) setSelectedSecId(parsed[0].id);
          } else {
            setSections(defaultSections);
            setSelectedSecId(defaultSections[0].id);
            localStorage.setItem('mowj_sections', JSON.stringify(defaultSections));
          }

          const savedStories = localStorage.getItem('mowj_stories');
          if (savedStories) {
            setStories(JSON.parse(savedStories));
          } else {
            setStories(defaultStories);
            localStorage.setItem('mowj_stories', JSON.stringify(defaultStories));
          }

          const savedUsers = localStorage.getItem('mowj_users_list');
          if (savedUsers) {
            setUsers(JSON.parse(savedUsers));
          } else {
            setUsers(defaultUsers);
            localStorage.setItem('mowj_users_list', JSON.stringify(defaultUsers));
          }

          const savedSubs = localStorage.getItem('mowj_submissions');
          if (savedSubs) {
            setSubmissions(JSON.parse(savedSubs));
          } else {
            setSubmissions(defaultSubmissions);
            localStorage.setItem('mowj_submissions', JSON.stringify(defaultSubmissions));
          }
        }, []);

        // ذخیره تغییرات بخش‌ها
        const saveSections = (updated) => {
          setSections(updated);
          localStorage.setItem('mowj_sections', JSON.stringify(updated));
        };

        // ذخیره تغییرات داستان‌ها
        const saveStories = (updated) => {
          setStories(updated);
          localStorage.setItem('mowj_stories', JSON.stringify(updated));
        };

        // ذخیره تغییرات آثار
        const saveSubmissions = (updated) => {
          setSubmissions(updated);
          localStorage.setItem('mowj_submissions', JSON.stringify(updated));
        };

        const allLessonsFlat = sections.flatMap(s => s.lessons.map(l => ({ ...l, sectionTitle: s.title })));

        // --- عملیات بخش‌ها و ویدیوها ---
        const handleAddSection = (e) => {
          e.preventDefault();
          if (!newSecTitle.trim()) return;
          const newSec = {
            id: 'sec_' + Date.now(),
            title: newSecTitle.trim(),
            badge: newSecBadge.trim() || 'آموزش تخصصی',
            lessons: []
          };
          const updated = [...sections, newSec];
          saveSections(updated);
          setSelectedSecId(newSec.id);
          setNewSecTitle('');
          setNewSecBadge('');
        };

        const handleDeleteSection = (secId) => {
          if (!confirm('آیا از حذف این بخش و تمام جلسات داخل آن مطمئن هستید؟')) return;
          const updated = sections.filter(s => s.id !== secId);
          saveSections(updated);
          if (selectedSecId === secId && updated.length > 0) {
            setSelectedSecId(updated[0].id);
          }
        };

        const handleAddLesson = (e) => {
          e.preventDefault();
          if (!newLessonTitle.trim() || !selectedSecId) return;
          const updated = sections.map(sec => {
            if (sec.id !== selectedSecId) return sec;
            return {
              ...sec,
              lessons: [
                ...sec.lessons,
                {
                  id: Date.now(),
                  title: newLessonTitle.trim(),
                  duration: newLessonDuration.trim() || '۱۵ دقیقه',
                  videoUrl: newLessonUrl.trim(),
                  status: newLessonStatus
                }
              ]
            };
          });
          saveSections(updated);
          setNewLessonTitle('');
          setNewLessonUrl('');
        };

        const handleDeleteLesson = (secId, lessonId) => {
          const updated = sections.map(sec => {
            if (sec.id !== secId) return sec;
            return {
              ...sec,
              lessons: sec.lessons.filter(l => l.id !== lessonId)
            };
          });
          saveSections(updated);
        };

        const handleUpdateLessonUrl = (secId, lessonId, newUrl) => {
          const updated = sections.map(sec => {
            if (sec.id !== secId) return sec;
            return {
              ...sec,
              lessons: sec.lessons.map(l => l.id === lessonId ? { ...l, videoUrl: newUrl } : l)
            };
          });
          saveSections(updated);
        };

        // --- عملیات بانک داستان ---
        const handleAddStory = (e) => {
          e.preventDefault();
          if (!storyTitle.trim() || !storyBody.trim()) return;
          const newSt = {
            id: Date.now(),
            title: storyTitle.trim(),
            theme: storyTheme.trim() || 'امید و خلاقیت',
            characters: storyChars.trim() || 'کاراکترهای کودکانه',
            story: storyBody.trim(),
            moral: storyMoral.trim() || 'با امید و تلاش می‌توان از چالش‌ها عبور کرد.'
          };
          saveStories([newSt, ...stories]);
          setStoryTitle('');
          setStoryTheme('');
          setStoryChars('');
          setStoryBody('');
          setStoryMoral('');
        };

        const handleDeleteStory = (id) => {
          if (!confirm('آیا این داستان از بانک داستان حذف شود؟')) return;
          saveStories(stories.filter(s => s.id !== id));
        };

        // --- خروجی اکسل (CSV با پشتیبانی کامل از فارسی در Excel) ---
        const exportUsersToExcel = () => {
          const headers = ['نام و نام خانوادگی', 'شماره دانشجویی', 'دانشگاه', 'رشته تحصیلی', 'مقطع', 'سن', 'شماره موبایل', 'تعداد ویدیوی مشاهده شده', 'وضعیت ارسال اثر'];
          const rows = users.map(u => {
            const hasSubmitted = submissions.some(s => s.phone === u.phone || s.studentId === u.studentId);
            return [
              u.fullName,
              u.studentId,
              u.university,
              u.major,
              u.degree,
              u.age,
              u.phone,
              `${(u.watchedIds || []).length} از ${allLessonsFlat.length}`,
              hasSubmitted ? 'ارسال کرده' : 'ارسال نکرده'
            ];
          });

          const csvContent = '\uFEFF' + [headers, ...rows].map(r => r.map(c => `"${c || ''}"`).join(',')).join('\n');
          const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
          const url = URL.createObjectURL(blob);
          const link = document.createElement('a');
          link.href = url;
          link.setAttribute('download', 'mowj-omid-students-report.csv');
          document.body.appendChild(link);
          link.click();
          document.body.removeChild(link);
        };

        const resetAllDemoData = () => {
          if (!confirm('آیا می‌خواهید تمام اطلاعات به حالت اولیه بازنشانی شوند؟')) return;
          localStorage.setItem('mowj_sections', JSON.stringify(defaultSections));
          localStorage.setItem('mowj_stories', JSON.stringify(defaultStories));
          localStorage.setItem('mowj_users_list', JSON.stringify(defaultUsers));
          localStorage.setItem('mowj_submissions', JSON.stringify(defaultSubmissions));
          window.location.reload();
        };

        // فیلتر لیست دانشجویان
        const filteredUsers = users.filter(u => {
          const matchesSearch =
            (u.fullName || '').includes(searchQuery) ||
            (u.studentId || '').includes(searchQuery) ||
            (u.phone || '').includes(searchQuery) ||
            (u.university || '').includes(searchQuery);
          const hasSub = submissions.some(s => s.phone === u.phone || s.studentId === u.studentId);
          if (userFilter === 'submitted') return matchesSearch && hasSub;
          if (userFilter === 'not_submitted') return matchesSearch && !hasSub;
          return matchesSearch;
        });

        return (
          <div className="min-h-screen flex flex-col">
            {/* هدر پنل ادمین */}
            <header className="sticky top-0 z-50 bg-zero-ink text-white border-b-2 border-zero-ink">
              <div className="max-w-7xl mx-auto px-4 sm:px-6 h-20 flex items-center justify-between">
                <div className="flex items-center gap-3">
                  <div className="w-10 h-10 rounded-xl bg-zero-lime text-zero-ink font-black flex items-center justify-center text-lg border-2 border-white">
                    م
                  </div>

                                        onChange={(e) => handleUpdateLessonUrl(sec.id, les.id, e.target.value)}
                                        placeholder="./video1.mp4 یا لینک مستقیم MP4"
                                        className="w-full px-2.5 py-1 rounded-lg bg-white border border-neutral-300 text-xs font-mono text-left"
                                      />
                                    </div>
                                  </div>
                                ))
                              )}
                            </div>
                          </div>
                        ))}
                      </div>
                    </div>
                  </div>

                </div>
              )}

              {/* ==================== تب ۴: مدیریت بانک داستان ==================== */}
              {activeTab === 'stories' && (
                <div className="grid lg:grid-cols-12 gap-6">
                  
                  {/* فرم افزودن داستان جدید */}
                  <div className="lg:col-span-5">
                    <div className="zero-card p-6 bg-white space-y-4">
                      <h3 className="text-base font-black text-zero-ink border-b border-neutral-200 pb-2">
                        📖 افزودن قصه جدید به بانک داستان
                      </h3>
                      <form onSubmit={handleAddStory} className="space-y-3.5">
                        <div>
                          <label className="block text-xs font-black mb-1">عنوان داستان</label>
                          <input
                            type="text"
                            required
                            value={storyTitle}
                            onChange={(e) => setStoryTitle(e.target.value)}
                            placeholder="مثال: ستاره‌ای که راهش را پیدا کرد"
                            className="input-zero"
                          />
                        </div>
                        <div>
                          <label className="block text-xs font-black mb-1">موضوع / تم داستان</label>
                          <input
                            type="text"
                            value={storyTheme}
                            onChange={(e) => setStoryTheme(e.target.value)}
                            placeholder="مثال: امید و پشتکار"
                            className="input-zero"
                          />
                        </div>
                        <div>
                          <label className="block text-xs font-black mb-1">شخصیت‌های پیشنهادی</label>
                          <input
                            type="text"
                            value={storyChars}
                            onChange={(e) => setStoryChars(e.target.value)}
                            placeholder="مثال: ستاره کوچک، ماه مهربان، جغد دانا"
                            className="input-zero"
                          />
                        </div>
                        <div>
                          <label className="block text-xs font-black mb-1">متن کامل داستان</label>
                          <textarea
                            rows="4"
                            required
                            value={storyBody}
                            onChange={(e) => setStoryBody(e.target.value)}
                            placeholder="متن قصه کودکانه را اینجا بنویسید..."
                            className="input-zero"
                          />
                        </div>
                        <div>
                          <label className="block text-xs font-black mb-1">پیام امیدبخش داستان</label>
                          <input
                            type="text"
                            value={storyMoral}
                            onChange={(e) => setStoryMoral(e.target.value)}
                            placeholder="نتیجه اخلاقی و پیام داستان"
                            className="input-zero"
                          />
                        </div>
                        <button type="submit" className="w-full btn-zero-primary">
                          ثبت در بانک داستان
                        </button>
                      </form>
                    </div>
                  </div>

                  {/* لیست داستان‌های موجود (فقط نمایش و حذف) */}
                  <div className="lg:col-span-7">
                    <div className="zero-card p-6 space-y-4">
                      <h3 className="text-lg font-black text-zero-ink border-b border-neutral-200 pb-3">
                        لیست داستان‌های فعال ({toFa(stories.length)} داستان)
                      </h3>

                      <div className="space-y-3">
                        {stories.map((st) => (
                          <div key={st.id} className="p-4 rounded-2xl border-2 border-zero-ink bg-zero-bg space-y-2">
                            <div className="flex items-center justify-between">
                              <div>
                                <span className="text-xs font-black text-zero-coral block">{st.theme}</span>
                                <h4 className="text-sm sm:text-base font-black text-zero-ink">{st.title}</h4>
                              </div>
                              <button
                                onClick={() => handleDeleteStory(st.id)}
                                className="px-3 py-1.5 rounded-lg bg-white border border-zero-ink text-xs font-bold text-zero-coral hover:bg-rose-50"
                              >
                                حذف داستان
                              </button>
                            </div>
                            <p className="text-xs text-neutral-600 font-bold">کاراکترها: {st.characters}</p>
                            <p className="text-xs sm:text-sm text-neutral-800 leading-relaxed">{st.story}</p>
                            <p className="text-xs font-bold text-neutral-600 pt-1 border-t border-neutral-200">
                              پیام: {st.moral}
                            </p>
                          </div>
                        ))}
                      </div>
                    </div>
                  </div>

                </div>
              )}

            </div>
          </div>
        );
      }

      const root = ReactDOM.createRoot(document.getElementById('root'));
      root.render(<AdminApp />);
    </script>
  </body>
</html>
